<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'self'; img-src 'self' file: data:; style-src 'self' 'unsafe-inline'; script-src 'self'"
  >
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>曲阳便签</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <header class="titlebar">
      <div class="brand">
        <img src="../assets/icon.png" alt="" class="brand-icon">
        <div>
          <strong>曲阳便签</strong>
          <span>Windows</span>
        </div>
      </div>
      <div class="search-box">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="10.5" cy="10.5" r="6.5"></circle>
          <path d="m15.5 15.5 4.5 4.5"></path>
        </svg>
        <input id="searchInput" type="search" placeholder="搜索标题、正文或标签" autocomplete="off">
      </div>
      <div class="title-actions">
        <button id="newNoteButton" class="primary-button" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
          新建便签
        </button>
        <button id="settingsButton" class="icon-button" type="button" aria-label="设置" title="设置">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 15.25A3.25 3.25 0 1 0 12 8.75a3.25 3.25 0 0 0 0 6.5Z"></path>
            <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-2.86 2.86-.06-.06A1.7 1.7 0 0 0 15 19.4a1.7 1.7 0 0 0-1 .6 1.7 1.7 0 0 0-.4 1.1V21H9.55v-.1A1.7 1.7 0 0 0 8.45 19.4a1.7 1.7 0 0 0-1.88.34l-.06.06-2.86-2.86.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-.6-1 1.7 1.7 0 0 0-1.1-.4H3V9.55h.1A1.7 1.7 0 0 0 4.6 8.45a1.7 1.7 0 0 0-.34-1.88L4.2 6.51 7.06 3.65l.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-.6 1.7 1.7 0 0 0 .4-1.1V3h4.05v.1A1.7 1.7 0 0 0 15.55 4.6a1.7 1.7 0 0 0 1.88-.34l.06-.06 2.86 2.86-.06.06A1.7 1.7 0 0 0 19.4 9c.1.38.31.72.6 1 .3.26.68.4 1.1.4h.1v4.05h-.1A1.7 1.7 0 0 0 19.4 15Z"></path>
          </svg>
        </button>
      </div>
    </header>

    <main class="workspace">
      <aside class="sidebar" aria-label="便签分类">
        <div class="sidebar-section-label">便签</div>
        <nav class="view-list">
          <button class="view-item active" data-view="all" type="button">
            <span class="view-icon">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14v16H5zM8 8h8M8 12h8M8 16h5"></path></svg>
            </span>
            <span>全部便签</span>
            <span class="count" id="allCount">0</span>
          </button>
          <button class="view-item" data-view="starred" type="button">
            <span class="view-icon">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2-5.6-3-5.6 3 1.1-6.2L3 9.6l6.2-.9L12 3Z"></path></svg>
            </span>
            <span>加星便签</span>
            <span class="count" id="starredCount">0</span>
          </button>
          <button class="view-item" data-view="trash" type="button">
            <span class="view-icon">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M7 7l1 13h8l1-13M10 11v5M14 11v5"></path></svg>
            </span>
            <span>回收站</span>
            <span class="count" id="trashCount">0</span>
          </button>
        </nav>

        <div class="sidebar-heading">
          <span>文件夹</span>
          <button id="addFolderButton" class="mini-icon-button" type="button" aria-label="新建文件夹" title="新建文件夹">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
          </button>
        </div>
        <nav id="folderList" class="folder-list"></nav>

        <div class="storage-note">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V6a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v14H5ZM8 8h8M8 12h8M8 16h5"></path></svg>
          <div>
            <strong>本地优先</strong>
            <span>数据保存在此电脑</span>
          </div>
        </div>
      </aside>

      <section class="note-column" aria-label="便签列表">
        <header class="column-header">
          <div>
            <h1 id="listTitle">全部便签</h1>
            <span id="listSubtitle">0 条便签</span>
          </div>
          <button id="sortButton" class="icon-button subtle" type="button" aria-label="切换排序" title="切换排序">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h12M8 12h9M8 18h6M4 5v14M2 17l2 2 2-2"></path></svg>
          </button>
        </header>
        <div id="noteList" class="note-list"></div>
        <div id="emptyList" class="empty-list hidden">
          <img src="../assets/icon.png" alt="">
          <strong>没有便签</strong>
          <span>点击“新建便签”开始记录</span>
        </div>
      </section>

      <section id="editorPane" class="editor-pane">
        <div id="editorEmpty" class="editor-empty">
          <div class="empty-paper">
            <svg viewBox="0 0 64 64" aria-hidden="true">
              <path d="M13 7h38v50H13z"></path>
              <path d="M21 19h22M21 28h22M21 37h15"></path>
              <path d="m39 48 5-12 8 8-12 5-1-1Z"></path>
            </svg>
            <h2>选择一条便签</h2>
            <p>或新建一条便签开始记录</p>
          </div>
        </div>

        <div id="editorContent" class="editor-content hidden">
          <header class="editor-header">
            <div class="editor-meta">
              <select id="folderSelect" aria-label="选择文件夹"></select>
              <span id="saveState">已保存</span>
            </div>
            <div class="editor-actions">
              <button id="starButton" class="icon-button subtle" type="button" aria-label="加星" title="加星">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2-5.6-3-5.6 3 1.1-6.2L3 9.6l6.2-.9L12 3Z"></path></svg>
              </button>
              <button id="pinButton" class="icon-button subtle" type="button" aria-label="置顶" title="置顶">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 4 6 0-.7 6 4.7 4.7H5l4.7-4.7L9 4ZM12 15v6"></path></svg>
              </button>
              <button id="copyButton" class="icon-button subtle" type="button" aria-label="复制正文" title="复制正文">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 8h11v11H8zM5 16H3V3h13v2"></path></svg>
              </button>
              <button id="exportButton" class="icon-button subtle" type="button" aria-label="导出网页" title="导出网页">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12M7 8l5-5 5 5M5 14v6h14v-6"></path></svg>
              </button>
              <button id="deleteButton" class="icon-button danger" type="button" aria-label="移到回收站" title="移到回收站">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M7 7l1 13h8l1-13M10 11v5M14 11v5"></path></svg>
              </button>
            </div>
          </header>

          <div class="paper-scroll">
            <article class="paper">
              <input id="noteTitle" class="note-title" type="text" placeholder="标题" maxlength="160">
              <div class="title-rule"></div>
              <div
                id="noteEditor"
                class="note-editor"
                contenteditable="true"
                role="textbox"
                aria-multiline="true"
                data-placeholder="开始记录…"
              ></div>

              <div class="trash-banner hidden" id="trashBanner">
                <span>这条便签在回收站中，只能查看。</span>
                <button id="restoreButton" class="text-button" type="button">恢复</button>
                <button id="permanentDeleteButton" class="text-button danger-text" type="button">彻底删除</button>
              </div>
            </article>
          </div>

          <footer class="format-toolbar" aria-label="格式工具栏">
            <button data-command="heading" type="button"><span class="format-heading">H</span>标题</button>
            <button data-command="center" type="button">居中</button>
            <button data-command="list" type="button">列表</button>
            <button data-command="bold" type="button"><strong>B</strong> 粗体</button>
            <button data-command="quote" type="button">引用</button>
            <button id="imageButton" type="button">
              <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"></rect><circle cx="8" cy="9" r="2"></circle><path d="m4 18 5-5 4 4 3-3 4 4"></path></svg>
              图片
            </button>
            <div class="color-control">
              <button id="colorButton" type="button" aria-haspopup="true" aria-expanded="false">
                <span class="color-indicator"></span>颜色
              </button>
              <div id="colorMenu" class="color-menu hidden" role="menu"></div>
            </div>
            <span class="toolbar-spacer"></span>
            <button data-command="undo" type="button" title="撤销">撤销</button>
            <button data-command="redo" type="button" title="重做">重做</button>
          </footer>
        </div>
      </section>
    </main>
  </div>

  <dialog id="settingsDialog" class="settings-dialog">
    <form method="dialog">
      <header>
        <div>
          <h2>设置</h2>
          <p>曲阳便签 Windows</p>
        </div>
        <button class="icon-button subtle" value="cancel" aria-label="关闭设置">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"></path></svg>
        </button>
      </header>
      <section>
        <h3>外观</h3>
        <label class="setting-row">
          <span>主题</span>
          <select id="themeSelect">
            <option value="system">跟随系统</option>
            <option value="light">浅色</option>
            <option value="dark">深色</option>
          </select>
        </label>
        <label class="setting-row range-row">
          <span>正文字号 <b id="fontScaleLabel">100%</b></span>
          <input id="fontScaleInput" type="range" min="0.8" max="1.5" step="0.1" value="1">
        </label>
      </section>
      <section>
        <h3>WebDAV 在线备份</h3>
        <div class="webdav-form">
          <label>
            <span>WebDAV 地址</span>
            <input id="webDavUrl" type="url" placeholder="https://dav.jianguoyun.com/dav/biji/">
          </label>
          <label>
            <span>用户名</span>
            <input id="webDavUsername" type="text" autocomplete="username">
          </label>
          <label>
            <span>密码（明文保存）</span>
            <input id="webDavPassword" type="text" autocomplete="off">
          </label>
          <p class="field-help">地址、用户名和密码会保存在本机设置中，密码按要求以明文显示和保存。</p>
          <label class="checkbox-row">
            <input id="webDavAutoSync" type="checkbox">
            <span>前台每 30 秒自动双向同步</span>
          </label>
          <div class="webdav-actions">
            <button id="webDavTestButton" class="secondary-button" type="button">测试连接</button>
            <button id="webDavSyncButton" class="secondary-button" type="button">立即同步</button>
          </div>
          <div id="webDavStatus" class="sync-status">尚未配置</div>
        </div>
      </section>
      <section>
        <h3>数据</h3>
        <button id="exportDataButton" class="setting-action" type="button">导出全部便签数据</button>
        <button id="importDataButton" class="setting-action" type="button">导入曲阳便签数据</button>
      </section>
      <section class="about-section">
        <h3>关于</h3>
        <p>曲阳便签 0.11.24 · 本地优先 · MIT License</p>
        <p>数据默认保存在当前 Windows 用户的应用数据目录。</p>
      </section>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
