name: Publish APK

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/lattice-release.keystore"

      - name: Test and build signed release
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/lattice-release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          VERSION_NAME="${GITHUB_REF_NAME#v}"
          ./gradlew testDebugUnitTest lintDebug assembleRelease \
            -PversionName="$VERSION_NAME" \
            -PversionCode="$GITHUB_RUN_NUMBER"

      - name: Verify and package
        run: |
          mkdir -p dist
          APK_SOURCE="app/build/outputs/apk/release/app-release.apk"
          APK_NAME="LatticeNotes-${GITHUB_REF_NAME}-release.apk"
          cp "$APK_SOURCE" "dist/$APK_NAME"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          "$APKSIGNER" verify --verbose "dist/$APK_NAME"
          cd dist
          sha256sum "$APK_NAME" > SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Lattice Notes ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/LatticeNotes-${{ github.ref_name }}-release.apk
            dist/SHA256SUMS.txt
